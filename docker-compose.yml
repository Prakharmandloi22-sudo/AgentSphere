version: '3.8'

services:
  # 1. PostgreSQL with pgvector support
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentsphere_secure_pw}
      POSTGRES_DB: ${POSTGRES_DB:-agentsphere_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/core-api/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./apps/core-api/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentsphere} -d ${POSTGRES_DB:-agentsphere_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # 2. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: agentsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. Python Gateway & Document Pipeline
  python-service:
    build:
      context: .
      dockerfile: apps/python-service/Dockerfile
    container_name: agentsphere-python-service
    restart: always
    environment:
      PORT: 8000
      DEFAULT_MODEL: gpt-4o-mini
      FALLBACK_MODEL: claude-3-5-sonnet
      DEFAULT_MODEL_PROVIDER: mock
      FALLBACK_MODEL_PROVIDER: mock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # 4. Node.js Core API Backend
  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    container_name: agentsphere-core-api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentsphere}:${POSTGRES_PASSWORD:-agentsphere_secure_pw}@postgres:5432/${POSTGRES_DB:-agentsphere_db}
      REDIS_URL: redis://redis:6379
      PYTHON_SERVICE_URL: http://python-service:8000
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-minimum-32-chars-long-example}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # 5. Next.js Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agentsphere-web
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - core-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:

name: AgentSphere CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-node:
    name: Node.js Backend & Shared Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types Package
        run: npm run build --workspace=packages/shared

      - name: Run Backend Unit & Security Tests
        run: cd apps/core-api && npx jest --coverage --detectOpenHandles --forceExit

      - name: Build Web Application
        run: npm run build --workspace=apps/web

  test-python:
    name: Python Gateway & Document Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/python-service/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          cd apps/python-service
          python -m pytest tests --verbose

  docker-lint:
    name: Docker Configuration Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
